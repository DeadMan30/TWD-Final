plugins {
    id 'com.android.application'
}

def androidSdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: ''
def ndkParentDir = androidSdkDir ? new File(androidSdkDir, 'ndk') : null
def installedNdkVer = (ndkParentDir != null && ndkParentDir.isDirectory())
    ? ndkParentDir.listFiles()?.findAll { it.isDirectory() && new File(it, 'source.properties').exists() }?.collect { it.name }?.sort()?.last()
    : null

android {
    namespace 'com.twdfinal.android'
    compileSdk 34
    if (installedNdkVer) {
        ndkVersion installedNdkVer
    }

    defaultConfig {
        applicationId 'com.twdfinal.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libtwdgame.so']
        }
    }
}
